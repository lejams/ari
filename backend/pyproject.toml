[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ari-fsp"
version = "0.1.0"
description = "ARI voice-based FSP training vertical slice"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19,<2",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=1.99,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "import-linter>=2.3,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ari"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated DDL strings (check constraints) cannot be wrapped.
"migrations/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

# Architecture rules from AGENTS.md, checked by `make lint` (lint-imports).
[tool.importlinter]
root_package = "ari"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward: api > infrastructure > application > domain"
type = "layers"
layers = ["ari.api", "ari.infrastructure", "ari.application", "ari.domain"]

[[tool.importlinter.contracts]]
name = "The learner application never imports the content pipeline"
type = "forbidden"
source_modules = ["ari.api", "ari.application", "ari.container", "ari.main", "ari.infrastructure.providers"]
forbidden_modules = ["ari.content", "ari.worker"]

[[tool.importlinter.contracts]]
name = "Content domain, ports, schemas and services stay free of infrastructure and the learner app"
type = "forbidden"
source_modules = [
  "ari.content.domain",
  "ari.content.ports",
  "ari.content.schemas",
  "ari.content.fake_handlers",
  "ari.content.services",
]
forbidden_modules = ["ari.infrastructure", "ari.api", "ari.application.services", "ari.container"]

[[tool.importlinter.contracts]]
name = "Domain and application never import vendor SDKs or persistence libraries"
type = "forbidden"
source_modules = ["ari.domain", "ari.application", "ari.content.domain", "ari.content.services"]
forbidden_modules = [
  "alembic",
  "fastapi",
  "httpx",
  "openai",
  "psycopg",
  "pydantic_settings",
  "sqlalchemy",
  "starlette",
  "uvicorn",
  "yaml",
]
