id: ARI-FSP-001-EN
version: "1.0"
mode: technical_test
validation_status: technical_translation_unvalidated
language: en-US
transcription_context: Medical history interview, right upper abdominal pain, gallbladder symptoms
unknown_response: I am not completely sure about that.
out_of_scope_response: I am here because of this pain. Could we please talk about that?
title: Right upper abdominal pain — English technical translation
public_summary: A 52-year-old woman presents with right upper abdominal pain that started the previous evening.
difficulty: beginner_intermediate
educational_target:
  exam: FSP technical translation
  phase: doctor-patient interview
  duration_minutes: 20
demographics:
  name: Sabine Keller
  age: 52
  gender: female
  occupation: office administrator
  height_cm: 165
  weight_kg: 78
demographic_responses:
  name: My name is Sabine Keller.
  age: I am 52 years old.
  gender: I am a woman.
  occupation: I work as an office administrator.
  height_cm: I am 1.65 metres tall.
  weight_kg: I weigh 78 kilograms.
source_revealed_fact_ids:
  opening_statement:
    - symptom.location
opening_statement: Good morning, doctor. I have had quite severe pain here in the upper right side of my abdomen since last night. It became much worse overnight.
communication_style: Moderately anxious, cooperative, and normally talkative. Use everyday language. Answer only the question asked and usually give one or two pieces of information. Never recite the whole case. Ask for repetition or clarification when a question is unclear. Occasionally express concern about the pain.
facts:
  - id: symptom.location
    category: current_history
    value: Pain in the right upper abdomen
    patient_phrase: The pain is here on the upper right side, under my ribs.
    disclosure: spontaneous
  - id: symptom.onset
    category: current_history
    value: Started yesterday evening at about 9 p.m.
    patient_phrase: It started yesterday evening at about nine.
    disclosure: when_asked
  - id: symptom.meal_context
    category: current_history
    value: Started about two hours after a large dinner of schnitzel and chips
    patient_phrase: It started about two hours after a big dinner with schnitzel and chips.
    disclosure: when_asked_about_activity_or_food
  - id: symptom.quality
    category: current_history
    value: Constant pressure and cramping
    patient_phrase: It feels like pressure and cramping all the time.
    disclosure: when_asked
  - id: symptom.intensity
    category: current_history
    value: Pain severity 8 out of 10
    patient_phrase: On a scale from zero to ten, it is an eight.
    disclosure: when_explicitly_asked
  - id: symptom.radiation
    category: current_history
    value: Radiates to the right shoulder and partly to the back
    patient_phrase: Sometimes it goes into my right shoulder and a little into my back.
    disclosure: when_asked
  - id: symptom.progression
    category: current_history
    value: Initially moderate, worsened overnight, and constant this morning
    patient_phrase: It was moderate at first, but it became stronger overnight and has been constant this morning.
    disclosure: when_asked
  - id: symptom.aggravating_factors
    category: current_history
    value: Movement and deep breaths make it slightly worse
    patient_phrase: Movement and taking a deep breath make it a little worse.
    disclosure: when_asked
  - id: symptom.relieving_factors
    category: current_history
    value: Lying still helps slightly; paracetamol 500 mg last night barely helped
    patient_phrase: Lying still helps a little. A 500 milligram paracetamol tablet last night hardly helped.
    disclosure: when_asked
  - id: symptom.nausea
    category: associated_symptoms
    value: Persistent nausea since last night
    patient_phrase: I have felt sick constantly since last night.
    disclosure: when_asked
  - id: symptom.vomiting
    category: associated_symptoms
    value: Vomited food once overnight, without blood
    patient_phrase: I vomited food once during the night, but there was no blood.
    disclosure: when_asked
  - id: symptom.fever
    category: associated_symptoms
    value: Temperature of 38.2 degrees Celsius measured this morning
    patient_phrase: I measured a temperature of 38.2 this morning.
    disclosure: when_asked
  - id: symptom.chills_absent
    category: associated_symptoms
    value: No shaking chills
    patient_phrase: I have not had any shaking chills.
    disclosure: when_asked
  - id: symptom.appetite
    category: associated_symptoms
    value: Markedly reduced appetite
    patient_phrase: I have much less appetite than usual.
    disclosure: when_asked
  - id: symptom.stool
    category: associated_symptoms
    value: Normal stool yesterday; no diarrhoea, constipation, black stool, or blood
    patient_phrase: My stool was normal yesterday. No diarrhoea, constipation, black stool, or blood.
    disclosure: when_asked
  - id: symptom.urine
    category: associated_symptoms
    value: No burning, frequency, blood, or dark urine
    patient_phrase: It does not burn when I urinate, I do not go more often, and there is no blood or dark urine.
    disclosure: when_asked
  - id: symptom.jaundice_absent
    category: associated_symptoms
    value: No jaundice
    patient_phrase: No, my skin or eyes have not turned yellow.
    disclosure: when_asked
  - id: symptom.chest_pain_absent
    category: associated_symptoms
    value: No chest pain
    patient_phrase: I have no pain in my chest.
    disclosure: when_asked
  - id: symptom.dyspnea_absent
    category: associated_symptoms
    value: No shortness of breath
    patient_phrase: I am not short of breath.
    disclosure: when_asked
  - id: history.previous_episode
    category: past_history
    value: Two milder episodes at the same site after heavy meals in the past six months, resolving after about one hour
    patient_phrase: I had milder pain in the same place twice after heavy meals in the last six months. It went away by itself after about an hour.
    disclosure: when_asked
  - id: history.hypertension
    category: past_history
    value: Arterial hypertension for six years
    patient_phrase: I have had high blood pressure for six years.
    disclosure: when_asked
  - id: history.diabetes_absent
    category: past_history
    value: No diabetes mellitus
    patient_phrase: I do not have diabetes.
    disclosure: when_asked
  - id: history.cardiovascular_absent
    category: past_history
    value: No known cardiovascular disease
    patient_phrase: I do not have any known heart or circulation condition.
    disclosure: when_asked
  - id: history.liver_absent
    category: past_history
    value: No known liver disease
    patient_phrase: I do not have any known liver disease.
    disclosure: when_asked
  - id: history.gallstones_absent
    category: past_history
    value: No known gallstones
    patient_phrase: I have never been told that I have gallstones.
    disclosure: when_asked
  - id: history.other_none
    category: past_history
    value: No other relevant medical conditions
    patient_phrase: Apart from that, I do not have any important medical conditions.
    disclosure: when_asked
  - id: surgery.caesarean_sections
    category: past_surgical_history
    value: Caesarean sections in 2002 and 2005
    patient_phrase: I had caesarean sections in 2002 and 2005.
    disclosure: when_asked
  - id: medication.ramipril
    category: medication
    value: Ramipril 5 mg once daily
    patient_phrase: I take 5 milligrams of ramipril once a day.
    disclosure: when_asked
  - id: medication.paracetamol
    category: medication
    value: One dose of paracetamol 500 mg last night
    patient_phrase: I took one 500 milligram paracetamol tablet last night.
    disclosure: when_asked
  - id: allergy.penicillin
    category: allergy
    value: Non-anaphylactic penicillin allergy causing an itchy rash
    patient_phrase: Penicillin gives me an itchy rash, but I have never had a severe allergic reaction.
    disclosure: when_asked
  - id: allergy.food_none
    category: allergy
    value: No known food allergies
    patient_phrase: I do not know of any food allergies.
    disclosure: when_asked
  - id: family.mother
    category: family_history
    value: Mother aged 76 with hypertension and gallstones; gallbladder removed in her sixties
    patient_phrase: My mother is 76. She has high blood pressure and had gallstones, and her gallbladder was removed in her sixties.
    disclosure: when_asked
  - id: family.father
    category: family_history
    value: Father died from a heart attack aged 72
    patient_phrase: My father died from a heart attack when he was 72.
    disclosure: when_asked
  - id: family.sister
    category: family_history
    value: One healthy sister
    patient_phrase: I have one sister and she is healthy.
    disclosure: when_asked
  - id: social.smoking
    category: social_history
    value: Never smoked
    patient_phrase: I have never smoked.
    disclosure: when_asked
  - id: social.alcohol
    category: social_history
    value: One or two glasses of wine on weekends
    patient_phrase: I drink one or two glasses of wine at weekends.
    disclosure: when_asked
  - id: social.drugs
    category: social_history
    value: No recreational drugs
    patient_phrase: I do not use drugs.
    disclosure: when_asked
  - id: social.living_situation
    category: social_history
    value: Lives with her husband
    patient_phrase: I live with my husband.
    disclosure: when_asked
  - id: social.children
    category: social_history
    value: Two adult children
    patient_phrase: I have two adult children.
    disclosure: when_asked
  - id: gynecology.menopause
    category: gynecological_history
    value: Menopause since age 50
    patient_phrase: I have been through the menopause since I was 50.
    disclosure: when_asked
  - id: gynecology.pregnancy_absent
    category: gynecological_history
    value: Pregnancy excluded
    patient_phrase: I am not pregnant.
    disclosure: when_asked
  - id: gynecology.last_menstrual_period
    category: gynecological_history
    value: Last menstrual period about two years ago
    patient_phrase: My last period was about two years ago.
    disclosure: when_asked
  - id: concern.surgery
    category: patient_concern
    value: Concern about needing an operation
    patient_phrase: I am getting worried. Will I need an operation for this?
    disclosure: after_5_to_8_minutes_or_when_next_steps_discussed
  - id: concern.hospitalization
    category: patient_concern
    value: Concern about hospital admission
    patient_phrase: Will I have to stay in hospital?
    disclosure: when_hospitalization_is_mentioned
rubric:
  version: fsp-anamnesis-en-technical-v1
  criteria:
    - id: clinical_coverage
      label: Clinical coverage
      max_score: 5
      description: Explores complaint, onset, food relationship, pain characteristics, associated symptoms, red flags, history, medication, allergy, family, social and gynecological history.
    - id: structure
      label: Interview structure
      max_score: 5
      description: Uses a clear, clinically useful sequence and summarizes key information.
    - id: communication
      label: Communication
      max_score: 5
      description: Introduces the consultation, listens actively, shows empathy, explores concerns and asks understandable questions.
    - id: language
      label: English language
      max_score: 5
      description: Uses clear English with appropriate grammar and understandable phrasing.
    - id: vocabulary
      label: Medical vocabulary
      max_score: 5
      description: Uses appropriate medical vocabulary while keeping patient-facing language accessible.
