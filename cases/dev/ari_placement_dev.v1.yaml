  listening_items:
  - id: l-a1
    level: A1
    script: Bonjour, je m'appelle Anne Martin. J'ai trente-quatre ans et je viens de Lyon.
    question: "D'où vient Anne ?"
    options: [De Paris, De Lyon, De Marseille]
    answer_index: 1
  - id: l-a2
    level: A2
    script: J'ai de la fièvre et je tousse depuis deux jours. Ce matin, j'ai pris un comprimé.
    question: "Depuis quand la personne a-t-elle de la fièvre ?"
    options: [Depuis ce matin, Depuis une semaine, Depuis deux jours]
    answer_index: 2
  - id: l-b1
    level: B1
    script: Pendant que vous prenez ces comprimés, vous ne devez pas boire d'alcool. Sinon, le médicament peut agir plus fort que prévu.
    question: "Que faut-il éviter pendant le traitement ?"
    options: [L'alcool, Le café, Le sport]
    answer_index: 0
  - id: l-b2
    level: B2
    script: Bien que les symptômes aient diminué, nous recommandons de poursuivre le traitement jusqu'au bout afin que l'infection ne revienne pas.
    question: "Pourquoi faut-il poursuivre le traitement ?"
    options: [Parce que les symptômes s'aggravent, Pour que l'infection ne revienne pas, Parce que le médicament est bon marché]
    answer_index: 1
