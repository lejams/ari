id: technical-abdominal-pain-en
version: "1.1.0"
mode: technical_test
validation_status: synthetic_technical_test
language: en-US
transcription_context: Medical history interview in English with common clinical vocabulary
unknown_response: I am sorry, I do not know any more details about that.
out_of_scope_response: I cannot help with that. Please ask me about my symptoms.
title: Acute abdominal pain — English technical test
public_summary: An adult patient presents to the emergency department with acute abdominal pain.
difficulty: beginner_intermediate
educational_target:
  exam: technical_test
  phase: doctor-patient interview
  duration_minutes: 20
demographics:
  name: Anna Keller
  age: 47
  gender: female
  occupation: primary school teacher
demographic_responses:
  name: My name is Anna Keller.
  age: I am 47 years old.
  gender: I am a woman.
  occupation: I work as a primary school teacher.
source_revealed_fact_ids:
  opening_statement:
    - symptom.location
opening_statement: Hello. I have had severe pain in my right upper abdomen since last night.
communication_style: Worried and cooperative. Give short answers in everyday language and use medical terms only when asked.
facts:
  - id: symptom.location
    category: current_history
    value: Pain in the right upper abdomen
    patient_phrase: The pain is here in my right upper abdomen.
    disclosure: spontaneous
  - id: symptom.onset
    category: current_history
    value: Started yesterday at about 11 p.m., roughly two hours after a fatty dinner
    patient_phrase: It started yesterday at about 11 p.m., around two hours after a very fatty dinner.
    disclosure: when_asked
  - id: symptom.quality
    category: current_history
    value: Severe, constant, pressing pain
    patient_phrase: The pain is severe, constant, and feels like pressure.
    disclosure: when_asked
  - id: symptom.radiation
    category: current_history
    value: The pain radiates to the right shoulder and back
    patient_phrase: The pain goes into my right shoulder and my back.
    disclosure: when_asked
  - id: symptom.intensity
    category: current_history
    value: Pain intensity is 8 out of 10
    patient_phrase: On a scale from zero to ten, the pain is an eight.
    disclosure: when_asked
  - id: symptom.nausea
    category: current_history
    value: Nausea and one episode of vomiting
    patient_phrase: I feel nauseous and I vomited once.
    disclosure: when_asked
  - id: symptom.fever
    category: current_history
    value: Temperature measured at home was 38.2 degrees Celsius
    patient_phrase: I measured a temperature of 38.2 degrees Celsius at home.
    disclosure: when_asked
  - id: symptom.jaundice
    category: current_history
    value: No yellow eyes, dark urine, or pale stool
    patient_phrase: My eyes are not yellow, my urine is not dark, and my stool is not pale.
    disclosure: when_asked
  - id: history.previous_episode
    category: past_history
    value: Two similar but shorter episodes of pain during the last three months
    patient_phrase: I had similar pain twice in the last three months, but those episodes were shorter.
    disclosure: when_asked
  - id: history.hypertension
    category: past_history
    value: Arterial hypertension for five years
    patient_phrase: I have had high blood pressure for five years.
    disclosure: when_asked
  - id: medication.ramipril
    category: medication
    value: Ramipril 5 mg once daily
    patient_phrase: I take 5 milligrams of ramipril once a day.
    disclosure: when_asked
  - id: allergy.penicillin
    category: allergy
    value: Penicillin allergy causing a skin rash
    patient_phrase: I am allergic to penicillin and it gives me a skin rash.
    disclosure: when_asked
  - id: surgery.none
    category: past_history
    value: No previous operations
    patient_phrase: I have never had an operation.
    disclosure: when_asked
  - id: social.smoking
    category: social_history
    value: Does not smoke
    patient_phrase: I do not smoke.
    disclosure: when_asked
  - id: social.alcohol
    category: social_history
    value: One or two glasses of wine on weekends
    patient_phrase: I drink one or two glasses of wine on weekends.
    disclosure: when_asked
  - id: family.father
    category: family_history
    value: Her father had gallstones
    patient_phrase: My father had gallstones.
    disclosure: when_asked
rubric:
  version: technical-anamnesis-en-v1
  criteria:
    - id: clinical_coverage
      label: Clinical coverage
      max_score: 5
      description: Explores the complaint, associated symptoms, history, medication, and allergy.
    - id: structure
      label: Interview structure
      max_score: 5
      description: Uses a clear, clinically useful sequence and summarizes key information.
    - id: communication
      label: Communication
      max_score: 5
      description: Listens actively, shows empathy, and asks understandable questions.
    - id: language
      label: English language
      max_score: 5
      description: Uses clear English with understandable grammar and phrasing.
    - id: vocabulary
      label: Medical vocabulary
      max_score: 5
      description: Uses appropriate vocabulary while keeping patient-facing language accessible.
