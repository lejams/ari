title: Akute Bauchschmerzen
public_summary: Eine erwachsene Patientin stellt sich mit akuten Bauchschmerzen in der Notaufnahme vor.
difficulty: beginner_intermediate
educational_target:
  exam: FSP
  phase: Arzt-Patienten-Gespräch
  duration_minutes: 20
demographics:
  name: Anna Keller
  age: 47
  gender: weiblich
  occupation: Grundschullehrerin
demographic_responses:
  name: Ich heiße Anna Keller.
  age: Ich bin 47 Jahre alt.
  gender: Ich bin eine Frau.
  occupation: Ich arbeite als Grundschullehrerin.
source_revealed_fact_ids:
  opening_statement:
    - symptom.location
opening_statement: Guten Tag. Ich habe seit heute Nacht starke Schmerzen im rechten Oberbauch.
communication_style: Besorgt und kooperativ. Antworten kurz und alltagssprachlich; medizinische Begriffe nur auf Nachfrage.
facts:
  - id: symptom.location
    category: current_history
    value: Schmerzen im rechten Oberbauch
    patient_phrase: Die Schmerzen sind hier im rechten Oberbauch.
    disclosure: spontaneous
  - id: symptom.onset
    category: current_history
    value: Beginn gestern gegen 23 Uhr, ungefähr zwei Stunden nach einem fettreichen Abendessen
    patient_phrase: Es hat gestern gegen 23 Uhr angefangen, ungefähr zwei Stunden nach einem sehr fettigen Abendessen.
    disclosure: when_asked
  - id: symptom.quality
    category: current_history
    value: Starker, anhaltender und drückender Schmerz
    patient_phrase: Der Schmerz ist stark, ständig da und fühlt sich drückend an.
    disclosure: when_asked
  - id: symptom.radiation
    category: current_history
    value: Ausstrahlung in die rechte Schulter und den Rücken
    patient_phrase: Der Schmerz zieht in meine rechte Schulter und in den Rücken.
    disclosure: when_asked
  - id: symptom.intensity
    category: current_history
    value: Schmerzstärke 8 von 10
    patient_phrase: Auf einer Skala von null bis zehn ist der Schmerz bei acht.
    disclosure: when_asked
  - id: symptom.nausea
    category: current_history
    value: Übelkeit und einmaliges Erbrechen
    patient_phrase: Mir ist übel und ich habe einmal erbrochen.
    disclosure: when_asked
  - id: symptom.fever
    category: current_history
    value: Zu Hause gemessene Temperatur 38,2 Grad Celsius
    patient_phrase: Zu Hause habe ich 38,2 Grad Fieber gemessen.
    disclosure: when_asked
  - id: symptom.jaundice
    category: current_history
    value: Keine gelben Augen, kein dunkler Urin und kein heller Stuhl
    patient_phrase: Meine Augen sind nicht gelb, der Urin ist nicht dunkel und der Stuhl nicht hell.
    disclosure: when_asked
  - id: history.previous_episode
    category: past_history
    value: Zwei ähnliche, kürzere Schmerzepisoden in den letzten drei Monaten
    patient_phrase: In den letzten drei Monaten hatte ich schon zweimal ähnliche Schmerzen, aber sie waren kürzer.
    disclosure: when_asked
  - id: history.hypertension
    category: past_history
    value: Arterielle Hypertonie seit fünf Jahren
    patient_phrase: Ich habe seit fünf Jahren hohen Blutdruck.
    disclosure: when_asked
  - id: medication.ramipril
    category: medication
    value: Ramipril 5 mg einmal täglich
    patient_phrase: Ich nehme einmal täglich 5 Milligramm Ramipril.
    disclosure: when_asked
  - id: allergy.penicillin
    category: allergy
    value: Penicillinallergie mit Hautausschlag
    patient_phrase: Ich bin gegen Penicillin allergisch und bekomme davon Hautausschlag.
    disclosure: when_asked
  - id: surgery.none
    category: past_history
    value: Keine früheren Operationen
    patient_phrase: Ich wurde bisher noch nie operiert.
    disclosure: when_asked
  - id: social.smoking
    category: social_history
    value: Nichtraucherin
    patient_phrase: Ich rauche nicht.
    disclosure: when_asked
  - id: social.alcohol
    category: social_history
    value: Ein bis zwei Gläser Wein am Wochenende
    patient_phrase: Am Wochenende trinke ich ein bis zwei Gläser Wein.
    disclosure: when_asked
  - id: family.father
    category: family_history
    value: Vater hatte Gallensteine
    patient_phrase: Mein Vater hatte Gallensteine.
    disclosure: when_asked
