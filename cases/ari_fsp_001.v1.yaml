  - id: social.living_situation
    category: social_history
    value: Lebt mit ihrem Ehemann zusammen
    patient_phrase: Ich lebe mit meinem Mann zusammen.
    disclosure: when_asked
  - id: social.children
    category: social_history
    value: Zwei erwachsene Kinder
    patient_phrase: Ich habe zwei erwachsene Kinder.
    disclosure: when_asked
  - id: gynecology.menopause
    category: gynecological_history
    value: Menopause seit dem Alter von 50 Jahren
    patient_phrase: Ich bin seit meinem 50. Lebensjahr in den Wechseljahren.
    disclosure: when_asked
  - id: gynecology.pregnancy_absent
    category: gynecological_history
    value: Schwangerschaft ausgeschlossen
    patient_phrase: Schwanger bin ich nicht.
    disclosure: when_asked
  - id: gynecology.last_menstrual_period
    category: gynecological_history
    value: Letzte Menstruation vor ungefähr zwei Jahren
    patient_phrase: Meine letzte Regelblutung war vor ungefähr zwei Jahren.
    disclosure: when_asked
  - id: concern.surgery
    category: patient_concern
    value: Sorge vor einer notwendigen Operation
    patient_phrase: Ich mache mir langsam Sorgen. Muss ich deswegen operiert werden?
    disclosure: after_5_to_8_minutes_or_when_next_steps_discussed
  - id: concern.hospitalization
    category: patient_concern
    value: Sorge vor einem Krankenhausaufenthalt
    patient_phrase: Muss ich denn im Krankenhaus bleiben?
    disclosure: when_hospitalization_is_mentioned
rubric:
  version: fsp-anamnesis-v1
  criteria:
    - id: clinical_coverage
      label: Clinical coverage
      max_score: 5
      description: Explores complaint, onset, food relationship, pain characteristics, associated symptoms, red flags, history, medication, allergy, family, social and gynecological history.
    - id: structure
      label: Interview structure
      max_score: 5
      description: Uses a clear, clinically useful sequence and summarizes key information.
    - id: communication
      label: Communication
      max_score: 5
      description: Introduces the consultation, listens actively, shows empathy, explores concerns and asks understandable questions.
    - id: language
      label: German language
      max_score: 5
      description: Uses clear German with appropriate grammar and understandable phrasing.
    - id: vocabulary
      label: Medical vocabulary
      max_score: 5
      description: Uses appropriate medical vocabulary while keeping patient-facing language accessible.
