name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install locked Python dependencies
        run: make install-locked
      - name: Backend tests
        run: make test-backend
      - name: Ruff
        run: .venv/bin/ruff check backend
      - name: Mypy strict
        run: .venv/bin/mypy backend/src
      - name: JavaScript syntax and PCM resampler
        run: make test-web
      - name: Alembic fresh database and schema drift
        env:
          ARI_DATABASE_URL: sqlite:///${{ runner.temp }}/ari-ci.db
        run: |
          .venv/bin/alembic -c alembic.ini upgrade head
          .venv/bin/alembic -c alembic.ini check
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - name: Install locked browser test dependencies
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Install browser for local synthetic E2E
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Synthetic onboarding to progression in a browser
        run: |
          PYTHONPATH=backend/src .venv/bin/python -m ari.demo --port 8010 >"${RUNNER_TEMP}/ari-demo.log" 2>&1 &
          demo_pid=$!
          trap 'kill -INT "$demo_pid"; wait "$demo_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            kill -0 "$demo_pid" || { cat "${RUNNER_TEMP}/ari-demo.log"; exit 1; }
            if curl --fail --silent http://127.0.0.1:8010/api/health; then break; fi
            sleep 1
          done
          pnpm --dir web test:e2e
