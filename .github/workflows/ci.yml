name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stage_release: {description: "Build and stage this selected ref", required: true, default: true, type: boolean}
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARI_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      ARI_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ari_platform
      ARI_CONTENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ari_content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install locked Python dependencies
        run: make install-locked
      - name: Create the platform and content databases
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE ari_platform'
          psql postgresql://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE ari_content'
      - name: Backend tests
        run: make test-backend
      - name: Ruff
        run: .venv/bin/ruff check backend
      - name: Mypy strict
        run: .venv/bin/mypy backend/src
      - name: Import contracts (layers, no vendor SDK in domain/application)
        run: PYTHONPATH=backend/src .venv/bin/lint-imports --config backend/pyproject.toml
      - name: Shellcheck deploy scripts
        run: shellcheck deploy/*.sh
      - name: Compose config is valid (anchors and interpolation)
        run: docker compose --profile serve config -q
      - name: Staging Compose config is valid
        run: docker compose -p ari-staging -f docker-compose.yml -f deploy/staging.compose.yml --profile serve config -q
      - name: Docker image builds
        run: docker build -t ari:ci .
      - name: JavaScript syntax and PCM resampler
        run: make test-web
      - name: Back-office web client and DOM tests
        run: make test-backoffice-web
      - name: Alembic fresh database and schema drift
        run: |
          .venv/bin/alembic -c alembic.ini -n platform upgrade head
          .venv/bin/alembic -c alembic.ini -n platform check
          .venv/bin/alembic -c alembic.ini -n content upgrade head
          .venv/bin/alembic -c alembic.ini -n content check
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - name: Install locked browser test dependencies
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Install browser for local synthetic E2E
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Synthetic onboarding to progression in a browser
        run: |
          export ARI_E2E_ACCOUNT_FILE="${RUNNER_TEMP}/ari-e2e-accounts.json"
          PYTHONPATH=backend/src .venv/bin/python -m ari.demo --port 8010 >"${RUNNER_TEMP}/ari-demo.log" 2>&1 &
          demo_pid=$!
          trap 'kill -INT "$demo_pid"; wait "$demo_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            kill -0 "$demo_pid" || { cat "${RUNNER_TEMP}/ari-demo.log"; exit 1; }
            if curl --fail --silent http://127.0.0.1:8010/api/health; then break; fi
            sleep 1
          done
          PYTHONPATH=backend/src .venv/bin/python web/tests/seed-e2e-accounts.py "${ARI_E2E_ACCOUNT_FILE}"
          pnpm --dir web test:e2e
  image:
    name: Build immutable release image
    needs: quality
    if: >-
      vars.STAGING_ENABLED == 'true' && github.event_name != 'pull_request' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.stage_release == true))
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    outputs: {digest: "${{ steps.build.outputs.digest }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: build
        uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: "ghcr.io/lejams/ari:${{ github.sha }}"}
  bundle:
    name: Assemble immutable release bundle
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create deployable source bundle
        env: {RELEASE_SHA: "${{ github.sha }}", RELEASE_DIGEST: "${{ needs.image.outputs.digest }}"}
        run: |
          set -euo pipefail
          image="ghcr.io/lejams/ari@${RELEASE_DIGEST}"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$RELEASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid release metadata" >&2; exit 1; }
          mkdir -p release-bundle/deploy/postgres
          cp docker-compose.yml release-bundle/
          cp deploy/Caddyfile deploy/backup.sh deploy/lock.sh deploy/release.sh deploy/staging.compose.yml release-bundle/deploy/
          cp -R deploy/postgres/init release-bundle/deploy/postgres/
          printf '{"sha":"%s","image":"%s"}\n' "$RELEASE_SHA" "$image" > release-bundle/release.json
      - uses: actions/upload-artifact@v4
        with: {name: release-bundle, path: release-bundle, if-no-files-found: error}
  staging:
    name: Stage staging release
    needs: [image, bundle]
    runs-on: ubuntu-latest
    environment: staging
    concurrency: {group: deploy-staging, cancel-in-progress: false}
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: release-bundle, path: release-bundle}
      - name: Transfer and activate the immutable staging release
        env:
          DEPLOY_HOST: "${{ vars.DEPLOY_HOST }}"
          DEPLOY_USER: "${{ vars.DEPLOY_USER }}"
          DEPLOY_PORT: "${{ vars.DEPLOY_PORT || '22' }}"
          DEPLOY_PATH: "${{ vars.DEPLOY_PATH }}"
          SSH_KNOWN_HOSTS: "${{ secrets.SSH_KNOWN_HOSTS }}"
          SSH_PRIVATE_KEY: "${{ secrets.SSH_PRIVATE_KEY }}"
        run: deploy/transfer-release.sh staging release-bundle "ghcr.io/lejams/ari@${{ needs.image.outputs.digest }}" "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with: {name: staged-release, path: release-bundle, if-no-files-found: error, retention-days: 30, include-hidden-files: true}
