# Seuils de promotion d'`ari.evals` (plan, action 8, « Seuils initiaux de gates.yaml »).
#
# Valeurs initiales du plan, à recalibrer après la première mesure sur les vrais modèles. Toute
# modification crée une nouvelle `version` : un rapport garde la version des seuils qui l'a jugé.
#
# Règles (voir backend/src/ari/evals/gates.py) :
# - une métrique non mesurable (dénominateur vide) échoue : l'inconnu n'est jamais pris pour bon ;
# - un motif finissant par `*` s'applique à chaque métrique mesurée qu'il désigne ;
# - une seule NOUVELLE erreur critique (absente de la baseline) bloque, quelle que soit la moyenne.
#   Les types d'erreur critiques sont listés par suite dans `critical_outcomes`.

version: gates-v2
repetitions: 3  # Un run gate répète chaque item 3 fois (stabilité, intervalles).

suites:
  patient-leakage@1:
    thresholds:
      - metric: leak_rate
        max: 0.02
        source: "plan : fuite de faits ≤ 2 % des tours"
      - metric: stability.changed_rate
        max: 0.10
        source: "plan : ≤ 10 % de verdicts changeants sur 3 répétitions"
      - metric: structured_after_retry
        min: 0.995
        source: "plan : structure exploitable après un retry ≥ 99,5 %"
    # Proposition de l'agent, à confirmer par le propriétaire : l'acceptation de l'action 3 exige
    # « zéro invention » ; une référence à un fait absent du cas est donc traitée comme critique.
    critical_outcomes: [invented_fact]

  evaluation-language@1:
    thresholds:
      - metric: "language.precision.*"
        min: 0.85
        source: "plan : erreurs de langue, précision ≥ 0,85 par catégorie"
      - metric: "language.recall.*"
        min: 0.70
        source: "plan : erreurs de langue, rappel ≥ 0,70 par catégorie"
      - metric: stt_false_error_rate
        max: 0.05
        source: "plan : fausses erreurs dues au STT ≤ 5 %"
      - metric: evidence_hallucination_rate
        max: 0.02
        source: "plan : hallucination de preuve ≤ 2 %"
      - metric: stability.changed_rate
        max: 0.10
        source: "plan : ≤ 10 % de verdicts changeants sur 3 répétitions"
      - metric: structured_after_retry
        min: 0.995
        source: "plan : structure exploitable après un retry ≥ 99,5 %"
    critical_outcomes: []

  # Jeu de données en attente des annotations du médecin (docs/EVALS.md).
  evaluation-medical@1:
    thresholds:
      - metric: critical_medical_error.recall
        min: 0.90
        source: "plan : erreurs médicales critiques, rappel ≥ 0,90 (cible 0,98)"
      - metric: stability.changed_rate
        max: 0.10
        source: "plan : ≤ 10 % de verdicts changeants sur 3 répétitions"
      - metric: structured_after_retry
        min: 0.995
        source: "plan : structure exploitable après un retry ≥ 99,5 %"
    # Critique = marqué `critical` par le médecin dans son annotation, jamais décidé par le code.
    critical_outcomes: [missed_critical_medical_error]

  voice-sim@1:
    thresholds:
      - metric: leak_rate
        max: 0.02
        source: "plan : fuite de faits ≤ 2 % des tours"
      - metric: latency.exam.p95_ms
        max: 4000
        source: "plan, section 3 : latence examen fin de parole → début audio, plafond 4 s (objectif P95 2,5 s)"
      - metric: interruption.success_rate
        min: 1.0
        source: "plan, action 3 : interruption fonctionnelle"
      - metric: credit.violation_rate
        max: 0
        source: "plan : crédit d'un fait seulement après accusé de lecture"
      - metric: stability.changed_rate
        max: 0.10
        source: "plan : ≤ 10 % de verdicts changeants sur 3 répétitions"
    critical_outcomes: [invented_fact, credit_without_ack]
