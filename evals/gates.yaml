# Seuils de promotion d'`ari.evals` (plan, action 8, « Seuils initiaux de gates.yaml »).
#
# Valeurs initiales du plan, à recalibrer après la première mesure sur les vrais modèles. Toute
# modification crée une nouvelle `version` : un rapport garde la version des seuils qui l'a jugé.
#
# Règles (voir backend/src/ari/evals/gates.py) :
# - une métrique non mesurable (dénominateur vide) échoue : l'inconnu n'est jamais pris pour bon ;
# - un motif finissant par `*` s'applique à chaque métrique mesurée qu'il désigne ;
# - une seule NOUVELLE erreur critique (absente de la baseline) bloque, quelle que soit la moyenne.
#   Les types d'erreur critiques sont listés par suite dans `critical_outcomes`.

version: gates-v7
repetitions: 3  # Un run gate répète chaque item 3 fois (stabilité, intervalles).

suites:
  patient-leakage@1:
    thresholds:
      - metric: leak_rate
        max: 0.02
        source: "plan : fuite de faits ≤ 2 % des tours"
      - metric: stability.changed_rate
        max: 0.10
        source: "plan : ≤ 10 % de verdicts changeants sur 3 répétitions"
      - metric: structured_after_retry
        min: 0.995
        source: "plan : structure exploitable après un retry ≥ 99,5 %"
      - metric: invented_fact_rate
        max: 0.02
        source: "propriétaire, 24 octobre 2026 : une invention n'est pas critique, seuil aligné sur la fuite de faits (≤ 2 % des tours)"
    critical_outcomes: []

  evaluation-language@1:
    thresholds:
      - metric: "language.precision.*"
        min: 0.85
        source: "plan : erreurs de langue, précision ≥ 0,85 par catégorie"
      - metric: "language.recall.*"
        min: 0.70
        source: "plan : erreurs de langue, rappel ≥ 0,70 par catégorie"
      - metric: stt_false_error_rate
        max: 0.05
        source: "plan : fausses erreurs dues au STT ≤ 5 %"
      - metric: evidence_hallucination_rate
        max: 0.02
        source: "plan : hallucination de preuve ≤ 2 %"
      - metric: stability.changed_rate
        max: 0.10
        source: "plan : ≤ 10 % de verdicts changeants sur 3 répétitions"
      - metric: structured_after_retry
        min: 0.995
        source: "plan : structure exploitable après un retry ≥ 99,5 %"
    critical_outcomes: []

  # Version 2 du jeu (31 octobre 2026) : mêmes seuils que la version 1, le plan n'est pas modifié.
  # Ajout à valider par le propriétaire : `language_overall.precision` ≥ 0,85. La précision par
  # catégorie n'existe plus que pour les catégories injectées par le jeu ; les faux signalements
  # d'une catégorie jamais injectée (`other`) pèsent donc sur la précision globale, qui doit
  # elle aussi tenir le seuil du plan.
  evaluation-language@2:
    thresholds:
      - metric: "language.precision.*"
        min: 0.85
        source: "plan : erreurs de langue, précision ≥ 0,85 par catégorie"
      - metric: "language.recall.*"
        min: 0.70
        source: "plan : erreurs de langue, rappel ≥ 0,70 par catégorie"
      - metric: language_overall.precision
        min: 0.85
        source: "à valider : seuil du plan (≥ 0,85) appliqué à toutes les catégories rapportées, y compris celles que le jeu n'injecte pas"
      - metric: stt_false_error_rate
        max: 0.05
        source: "plan : fausses erreurs dues au STT ≤ 5 %"
      - metric: evidence_hallucination_rate
        max: 0.02
        source: "plan : hallucination de preuve ≤ 2 %"
      - metric: stability.changed_rate
        max: 0.10
        source: "plan : ≤ 10 % de verdicts changeants sur 3 répétitions"
      - metric: structured_after_retry
        min: 0.995
        source: "plan : structure exploitable après un retry ≥ 99,5 %"
    critical_outcomes: []

  # Version 3 du jeu (1er novembre 2026) : holdout neuf, mêmes seuils que la version 2. Règle
  # fixée d'avance par le propriétaire le 1er novembre 2026 : si le holdout échoue seulement sur
  # l'instabilité et le rappel (précision et hallucination passent), seuils à 0,15 et 0,65.
  evaluation-language@3:
    thresholds:
      - metric: "language.precision.*"
        min: 0.85
        source: "plan : erreurs de langue, précision ≥ 0,85 par catégorie"
      - metric: "language.recall.*"
        min: 0.70
        source: "plan : erreurs de langue, rappel ≥ 0,70 par catégorie"
      - metric: language_overall.precision
        min: 0.85
        source: "à valider : seuil du plan (≥ 0,85) appliqué à toutes les catégories rapportées, y compris celles que le jeu n'injecte pas"
      - metric: stt_false_error_rate
        max: 0.05
        source: "plan : fausses erreurs dues au STT ≤ 5 %"
      - metric: evidence_hallucination_rate
        max: 0.02
        source: "plan : hallucination de preuve ≤ 2 %"
      - metric: stability.changed_rate
        max: 0.10
        source: "plan : ≤ 10 % de verdicts changeants sur 3 répétitions"
      - metric: structured_after_retry
        min: 0.995
        source: "plan : structure exploitable après un retry ≥ 99,5 %"
    critical_outcomes: []

  # Jeu de données en attente des annotations du médecin (docs/EVALS.md).
  evaluation-medical@1:
    thresholds:
      - metric: critical_medical_error.recall
        min: 0.90
        source: "plan : erreurs médicales critiques, rappel ≥ 0,90 (cible 0,98)"
      - metric: stability.changed_rate
        max: 0.10
        source: "plan : ≤ 10 % de verdicts changeants sur 3 répétitions"
      - metric: structured_after_retry
        min: 0.995
        source: "plan : structure exploitable après un retry ≥ 99,5 %"
    # Critique = marqué `critical` par le médecin dans son annotation, jamais décidé par le code.
    critical_outcomes: [missed_critical_medical_error]

  # Test de niveau, partie orale (2 novembre 2026). Seuils initiaux : ceux du plan pour les erreurs
  # de langue, appliqués à l'ensemble des catégories (le jeu est petit : 45 transcripts), plus deux
  # seuils propres au test. À recalibrer après la première mesure sur les vrais modèles ; aucune
  # mesure réelle n'existe encore (voir docs/EVALS.md).
  placement@1:
    thresholds:
      - metric: language_overall.precision
        min: 0.85
        source: "plan : erreurs de langue, précision ≥ 0,85 (appliquée à toutes les catégories)"
      - metric: language_overall.recall
        min: 0.70
        source: "plan : erreurs de langue, rappel ≥ 0,70 (appliqué à toutes les catégories)"
      - metric: invented_quote_rate
        max: 0.02
        source: "plan : hallucination de preuve ≤ 2 % (citation absente de la transcription, écartée par le code)"
      - metric: weak_point.precision.all
        min: 0.85
        source: "à valider : un point faible affiché à tort envoie l'apprenant travailler la mauvaise chose"
      - metric: weak_point.recall.all
        min: 0.70
        source: "à valider : même seuil que le rappel des erreurs de langue"
      - metric: level.within_one
        min: 0.90
        source: "à valider : niveau estimé à un niveau près du niveau du texte, sur 90 % des transcripts"
      - metric: stability.changed_rate
        max: 0.10
        source: "plan : ≤ 10 % de verdicts changeants sur 3 répétitions"
      - metric: structured_after_retry
        min: 0.995
        source: "plan : structure exploitable après un retry ≥ 99,5 %"
    critical_outcomes: []

  voice-sim@1:
    thresholds:
      - metric: leak_rate
        max: 0.02
        source: "plan : fuite de faits ≤ 2 % des tours"
      - metric: latency.exam.p95_ms
        max: 4000
        source: "plan, section 3 : latence examen fin de parole → début audio, plafond 4 s (objectif P95 2,5 s)"
      - metric: interruption.success_rate
        min: 1.0
        source: "plan, action 3 : interruption fonctionnelle"
      - metric: credit.violation_rate
        max: 0
        source: "plan : crédit d'un fait seulement après accusé de lecture"
      - metric: stability.changed_rate
        max: 0.10
        source: "plan : ≤ 10 % de verdicts changeants sur 3 répétitions"
    critical_outcomes: [invented_fact, credit_without_ack]

  # Banque d'exercices de langue (2 novembre 2026, gates-v7). Ce gate ne conditionne pas une
  # mise en production mais l'entrée d'un lot dans la banque : `python -m ari.exercises_cli
  # import` refuse un lot si aucun rapport passé de cette suite ne correspond à ses prompts et à
  # son modèle de contrôle (backend/src/ari/evals/exercises/gate.py). Valeurs initiales, à
  # recalibrer après la première mesure sur les vrais modèles (jamais en cours de run).
  language-exercises@1:
    thresholds:
      - metric: false_accept_rate
        max: 0.0
        source: "plan, section 5, point 7 : zéro exercice faux qui passe les contrôles sur le jeu de test"
      - metric: false_reject_rate
        max: 0.25
        source: "à valider : un exercice juste refusé coûte une génération, pas un apprenant ; seuil initial, à recalibrer après la première mesure"
      - metric: mechanical_catch_rate
        min: 1.0
        source: "les contrôles mécaniques sont déterministes : aucun défaut mécanique ne passe"
      - metric: stability.changed_rate
        max: 0.10
        source: "plan : ≤ 10 % de verdicts changeants sur 3 répétitions"
      - metric: structured_after_retry
        min: 0.995
        source: "plan : structure exploitable après un retry ≥ 99,5 %"
    # Un exercice défectueux accepté est critique : une seule nouvelle occurrence bloque.
    critical_outcomes: [false_accept]
