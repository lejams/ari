# Retour arrière prévu par la décision du 15 octobre 2026.
# Équivalent : ARI_PATIENT_MODEL=gpt-5.6-terra, ARI_EVALUATION_MODEL=gpt-5.6-terra (OpenAI).
id: terra
description: Retour arrière, tous les modèles texte sur gpt-5.6-terra
provider: live
routes:
  patient: {provider: openai, model: gpt-5.6-terra}
  evaluation: {provider: openai, model: gpt-5.6-terra}
prompts:
  patient: patient-v3
  evaluation: evaluation-v8
